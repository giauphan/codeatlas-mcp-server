name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel redundant runs on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Stage 1: Fastest feedback first ─────────────
      - name: TypeScript type check
        run: npm run lint

      # ── Stage 2: Build ──────────────────────────────
      - name: Build
        run: npm run build

      # ── Stage 3: Validate package ─────────────────
      - name: Validate package contents
        run: npm pack --dry-run

      # ── Stage 4: Tests ─────────────────────────────
      - name: Test
        run: npm test

      # ── Stage 5: Coverage gate ─────────────────────
      - name: Coverage
        run: npx c8 --reporter=text --reportDir=coverage --check-coverage --lines=40 npm test

      # ── Upload coverage report ───────────────────────
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
